name: RescuePOV
options:
  bundleIdPrefix: com.naohiko
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.0"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  RescuePOV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RescuePOV
    info:
      path: RescuePOV/App/Info.plist
      properties:
        CFBundleDisplayName: "RescuePOV"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "暗闇で緊急時に背面LEDライト（トーチ）でSOSモールス信号を点滅させるために使用します。"
        NSLocationWhenInUseUsageDescription: "救助要請時に現在地（緯度・経度）を画面に表示し、救助隊に正確な位置を伝えるために使用します。"
        NSMotionUsageDescription: "端末を振る周期と速度を加速度センサーで検知し、空中に残像文字を同期表示するために使用します。"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.naohiko.RescuePOV
      PRODUCT_NAME: RescuePOV
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
